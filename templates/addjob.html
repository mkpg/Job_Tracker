<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Applications</title>
</head>

<body>
    <h1>Fill your Data Correctly</h1>
    <form method="post" id='form'>
        <input type='text' placeholder="Job Name" name='job_name' id="jn" required>
        <input type='text' placeholder="Company name" name='Company_name' id='cn' required>
        <label for="status">Status</label>
        <select name='status' id='status'>
            <option value='applied'>applied</option>
            <option value='in-progress'>in-progress</option>
            <option value='rejected'>rejected</option>
        </select>
        <input type='date' placeholder="applied date" name='app_date' id='app_date' required>
        <input type='date' placeholder="expected date" name='exp_date' id='exp_date' required>
        <button type='submit'>Add Job</button>
    </form>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let form = document.getElementById("form");
        form.addEventListener("submit", function (event) {
            event.preventDefault();
            var job_n = document.getElementById("jn");
            var company = document.getElementById("cn");
            var status = document.getElementById("status");
            var app_date = document.getElementById("app_date");
            var exp_date = document.getElementById("exp_date");
            if (!job_n.value) {
                alert("Please enter the name of the job");
                return;
            }
            if (!company.value) {
                alert("Please enter the name of the company");
                return;
            }
            if (!status.value) {
                alert("Please enter the status");
                return;
            }
            if (!app_date.value) {
                alert("Please enter the applied date");
                return;
            }
            if (!exp_date.value) {
                alert("Please enter the expected date");
                return;
            }
            if (job_n.value && company.value && status.value && app_date.value && exp_date.value && app_date.value < exp_date.value) {
                form.submit();
            }
            else {
                alert("Please enter the expected date");
                return;
            }
        });
    });
</script>

</html>
