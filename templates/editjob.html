<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job</title>
</head>

<body>
    <h1>Fill your Data Correctly</h1>
    <form method="post" action="/update">
        <input type='text' placeholder="Job Name" name='job_name' id='job_name' value="{{all_data[1]}}">
        <input type='text' placeholder="Company name" name='Company_name' id='Company_name' value="{{all_data[2]}}">
        <label for="status">Status</label>
        <select name='status' id='status' value="{{all_data[3]}}">
            <option value='applied'>applied</option>
            <option value='in-progress'>in-progress</option>
            <option value='rejected'>rejected</option>
        </select>
        <input type='date' placeholder="applied date" name='app_date' id='app_date' value="{{all_data[4]}}">
        <input type='date' placeholder="expected date" name='exp_date' id='exp_date' value="{{all_data[5]}}">
        <input type="hidden" name="job_id" id='job_id' value="{{all_data[0]}}">
        <button type='submit'>Update Job</button>
    </form>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.querySelector("form")
        form.addEventListener("submit", function (event) {
            event.preventDefault()
            let job_name = document.getElementById("job_name").value
            let company_name = document.getElementById("Company_name").value
            let status = document.getElementById("status").value
            let app_date = document.getElementById("app_date").value
            let exp_date = document.getElementById("exp_date").value


            if (!job_name) {
                alert("Please Enter Job Name")
            }
            else if (!company_name) {
                alert("Please Enter Company Name")
            }
            else if (!status) {
                alert("Please Enter Status")
            }
            else if (!app_date) {
                alert("Please Enter Applied Date")
            }
            else if (!exp_date) {
                alert("Please Enter Expected Date")
            }
            else {
                if (app_date < exp_date) {
                    form.submit()
                }
                else {
                    alert("Please Enter Valid Date")
                }
            }
        });
    })
</script>

</html>
